# Experimental metatrain wrapper for the equiformer_v3 direct transformer.
# This keeps the PET trainer/data pipeline and swaps only the neural architecture:
# - fitted energy composition baseline
# - fitted target scales for energy/force/stress
# - random rotation/inversion augmentation
# - same MPtrj training data and 30k sAlex validation data
# - direct force/stress prediction, no conservative gradients

wandb:
  project: pet-oam-mptrj
  name: structure-transformer-metatrain-160k-v37
  entity: null
  mode: online

seed: 42
device: cuda
base_precision: 32

architecture:
  name: experimental.structure_transformer


  model:
    # v37-style invariant backbone: relative torus coordinate features,
    # integer-harmonic coordinate RoPE, and no sequence-index atom ordering.
    max_num_elements: 128
    embed_dim: 768
    num_heads: 12
    num_layers: 12
    encoder_hidden_dim: null
    mlp_hidden_dim: null
    dropout: 0.05
    attn_dropout: null
    residual_dropout: null
    mlp_dropout: null

    position_scale: 1.0
    position_representation: fractional
    coordinate_encoding: v37_torus_relative
    coord_num_harmonics: 4
    use_rotary_embeddings: false
    use_periodic_rope: true
    atom_ordering: none
    center_positions: false
    fractional_wrap_eps: 1.0e-6
    atom_embedding_type: scalar
    atomic_number_scale: 118.0
    atom_scalar_embedding_scale: 1000.0
    include_cell_energy: true
    include_cell_stress: true

    regress_forces: true
    regress_stress: true
    direct_prediction: true
    avg_num_nodes: 1.0
    symmetrize_stress: false

  training:
    distributed: false
    distributed_port: 39591

    batch_size: 16
    batch_atom_bounds: [null, null]
    max_atoms_per_batch: 512
    min_atoms_per_batch: 0

    num_epochs: 100
    warmup_fraction: 0.1
    learning_rate: 1.0e-4
    weight_decay: null
    num_workers: null

    log_interval: 1
    checkpoint_interval: 1
    log_mae: true
    log_separate_blocks: false
    best_model_metric: rmse_prod
    grad_clip_norm: 1.0

    scale_targets: true
    atomic_baseline: {}
    fixed_scaling_weights: {}
    per_structure_targets:
      - non_conservative_stress

    loss:
      energy:
        type: huber
        weight: 1.0
        reduction: mean
        delta: 0.015
      non_conservative_force:
        type: huber
        weight: 1.0
        reduction: mean
        delta: 0.04
      non_conservative_stress:
        type: huber
        weight: 0.01
        reduction: mean
        delta: 0.004

    finetune:
      method: full
      read_from: null
      config: {}
      inherit_heads: {}

training_set:
  systems:
    read_from: data
    length_unit: angstrom
  targets:
    energy:
      key: e
      quantity: energy
      unit: eV
      forces: false
      stress: false
    non_conservative_force:
      key: f
      quantity: force
      unit: eV/A
      sample_kind: atom
      type:
        cartesian:
          rank: 1
    non_conservative_stress:
      key: s
      quantity: pressure
      unit: eV/A^3
      sample_kind: system
      type:
        cartesian:
          rank: 2

validation_set:
  systems:
    read_from: data_salex_val_30k
    length_unit: angstrom
  targets:
    energy:
      key: e
      quantity: energy
      unit: eV
      forces: false
      stress: false
    non_conservative_force:
      key: f
      quantity: force
      unit: eV/A
      sample_kind: atom
      type:
        cartesian:
          rank: 1
    non_conservative_stress:
      key: s
      quantity: pressure
      unit: eV/A^3
      sample_kind: system
      type:
        cartesian:
          rank: 2

test_set:
  indices: []
